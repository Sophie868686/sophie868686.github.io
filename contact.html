<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金錢借貸公證 - 三民公證</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<!-- 聯絡方式區塊開始 -->
<body>
<div id="header-container"></div>
<section style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; max-width: 1000px; margin: 40px auto; padding: 0 20px;">
  <div id="header-container"></div>
  <!-- 上方標題區 -->
  <div style="text-align: center; margin-bottom: 40px;">
    <h2 style="font-size: 28px; font-weight: normal; margin-bottom: 10px;">聯絡方式</h2>
    <!-- <p style="color: #666; font-size: 15px;">
      進一步瞭解我們的 <a href="#" style="color: #1b2fc5; text-decoration: none;">服務區域</a>
    </p> -->
  </div>

  <!-- 置中聯絡資訊容器 -->
  <div style="text-align: center; max-width: 600px; margin: 0 auto; padding: 20px;">
    
    <h3 style="font-size: 24px; font-weight: normal; margin-bottom: 20px; color: #333;">
      與我們聯繫 <span style="font-family: Arial, sans-serif; color: #555;">Contact</span>
    </h3>

    <p style="margin-bottom: 15px; color: #555;">後驛捷運站 2 號出口旁</p>

    <!-- 交通/停車示意圖連結 -->
    <p style="margin-bottom: 20px;">
      <a href="https://www.google.com/maps/search/?api=1&query=高雄市三民區博愛一路200號1樓" target="_blank" rel="noopener noreferrer" style="color: #333; text-decoration: underline;">
        交通/停車示意圖
      </a>
    </p>

    <!-- 中英文地址 -->
    <p style="margin: 6px 0;">
      <a href="https://www.google.com/maps/search/?api=1&query=高雄市三民區博愛一路200號1樓" target="_blank" rel="noopener noreferrer" style="color: #333; text-decoration: underline;">
        807高雄市三民區博愛一路200號1樓
      </a>
    </p>
    <p style="margin: 6px 0; font-size: 14px;">
      <a href="https://www.google.com/maps/search/?api=1&query=高雄市三民區博愛一路200號1樓" target="_blank" rel="noopener noreferrer" style="color: #666; text-decoration: underline;">
        1F., No. 200, Bo' ai 1st Rd., Sanmin Dist., Kaohsiung City 807, Taiwan (R.O.C.)
      </a>
    </p>

    <!-- Email -->
    <p style="margin: 12px 0;">
      <a href="mailto:whatislaw@gmail.com" style="color: #333; text-decoration: underline;">
        whatislaw@gmail.com
      </a>
    </p>

    <!-- 電話與傳真 -->
    <p style="margin: 6px 0; color: #555;">TEL (07) 313-1234</p>
    <p style="margin: 6px 0; color: #555;">FAX (07) 322-9888</p>

    <!-- 分隔線 (置中並稍微縮短) -->
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px auto; width: 50%;">

    <!-- LINE 聯絡 -->
    <p style="margin-top: 15px;">
      <a href="https://line.me/R/ti/p/@notary" target="_blank" rel="noopener noreferrer" style="color: #333; text-decoration: underline;">
        LINE @notary
      </a><br>
      <img src="/P/qr_code.png" alt="LINE QR Code" style="width: 300px; height: 300px; vertical-align: middle;  margin-top:30px;margin-left: 10px;">
    </p>

  </div>
</div>

  <script>
      // 載入 Header
      fetch('header.html')
      .then(response => response.text())
      .then(data => {
        // 1. 將抓取到的 HTML 塞入容器中
        document.getElementById('header-container').innerHTML = data;

        // =========================================
        // 2. 處理原本的手機版漢堡選單
        // =========================================
        const menuToggle = document.getElementById('menuToggle');
        const mainNav = document.getElementById('mainNav');
        
        if (menuToggle && mainNav) {
          menuToggle.addEventListener('click', function() {
            mainNav.classList.toggle('active');
          });
        }

        // =========================================
        // 3. 處理「稅務新聞」兩層選單點擊展開邏輯
        // =========================================
        // ⚠️ 此時網頁裡已經有 header 的內容了，可以安心選取
        const submenuBtns = document.querySelectorAll(".dropdown-submenu > a");

        submenuBtns.forEach(btn => {
          btn.addEventListener("click", function (e) {
            e.preventDefault();       // 阻止預設跳轉
            e.stopPropagation();      // 防止事件往上冒泡

            const currentSubmenu = this.parentElement;

            // 手風琴效果：關閉其他已經展開的子選單
            document.querySelectorAll(".dropdown-submenu").forEach(item => {
              if (item !== currentSubmenu) {
                item.classList.remove("active");
              }
            });

            // 切換目前點擊項目的展開 / 收合狀態
            currentSubmenu.classList.toggle("active");
          });
        });

      })
      .catch(error => {
        console.error('載入 header 時發生錯誤:', error);
      });

      // 載入 Footer
      fetch('footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
        });
    </script>
</section>
<!-- 聯絡方式區塊結束 -->
</body>
 </html>
