<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ================= 社群分享預覽設定 (Open Graph / OG 標籤) ================= -->
  <!-- 1. 分享出去時顯示的標題 -->
  <meta property="og:title" content="三民公證 — 房屋租約、合約公證與法律諮詢 (07)313-1234" />
  <!-- 2. 分享出去時顯示的網頁類型 (通常設為 website) -->
  <meta property="og:type" content="website" />
  <!-- 3. 您網站的正式網址 -->
  <meta property="og:url" content="https://www.tri.tw/" />
  <!-- 4. ⭐ 關鍵：分享出去時要顯示的「預覽圖片網址」（建議使用絕對路徑，如 https://...） -->
  <meta property="og:image" content="https://www.tri.tw/P/old_map.jpg" />
  <!-- 5. 分享出去時顯示的簡短描述 -->
  <meta property="og:description" content="公證效力及費用與法院相同。提供房屋租約公證、翻譯認證、外文書信認證等服務，專業公證人為您把關。" />
  <!-- 6. 網站名稱 -->
  <meta property="og:site_name" content="三民公證" />

  <title>三民公證 (07)313-1234</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/P/logo.jpg" type="image/jpeg">
</head>
<style>
    /* 上方的名片與地圖區塊：電腦版並排，手機版自動堆疊 */
    .content-top-row {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr; /* 左右各佔 50% 寬度 */
      gap: 30px;
      align-items: stretch;
    }

    /* 名片容器 */
    .card-box {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 51, 102, 0.08);
      border: 1px solid #e1e8ed;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* 地圖容器 */
    .map-box {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 51, 102, 0.08);
      border: 1px solid #e1e8ed;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .map-box h3 {
      font-size: 20px;
      color: #003366;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .map-responsive {
      position: relative;
      width: 100%;
      flex-grow: 1;
      min-height: 300px;
      border-radius: 6px;
      overflow: hidden;
    }

    .map-responsive iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* 👇 公證人介紹區塊：改成 Grid 網格排版，電腦版自動變兩欄並排、自動縮放 */
    .notary-section {
      max-width: 1100px;
      margin: 40px auto 80px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr; /* 電腦版左右並排，各佔一半 */
      gap: 30px;
    }

    .notary-card {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 51, 102, 0.08);
      border: 1px solid #e1e8ed;
      padding: 35px 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* 讓內容高度一致 */
    }

    .notary-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 51, 102, 0.15);
    }

    .notary-header {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .notary-avatar {
      width: 85px;
      height: 85px;
      color: #003366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      flex-shrink: 0;
      overflow: hidden; 
      object-position: center;
    }

    .notary-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      display: block;
    }

    .notary-title h2 {
      font-size: 24px;
      color: #003366;
      font-weight: 600;
    }

    /* 認證資格標籤 */
    .badge-certified {
      display: inline-block;
      background-color: #e6f0fa;
      color: #0066cc;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 12px;
      margin-top: 5px;
      font-weight: bold;
    }

    /* 資歷列表 */
    .notary-info-list {
      list-style: none;
      padding: 0;
    }

    .notary-info-list li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 12px;
      font-size: 15px;
      color: #444444;
      line-height: 1.6;
    }

    .notary-info-list li::before {
      content: "\f00c"; 
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 0;
      top: 2px;
      color: #0066cc;
      font-size: 14px;
    }

    /* 響應式調整：當螢幕小於 768px（手機板）時，上方名片/地圖與下方公證人卡片全部改為單欄上下堆疊 */
    @media (max-width: 768px) {
      .content-top-row,
      .notary-section {
        grid-template-columns: 1fr;
      }
    }
</style>
<body>

  <div id="header-container"></div>

  <!-- 2. Hero Banner 與橫幅標題 -->
  <section class="hero-banner">
    <h1 class="hero-title">公證效力及費用與法院相同</h1>
  </section>

  <!-- 麵包屑導航 (Breadcrumb) -->
  <div class="breadcrumb-container">
    <a href="index.html">首頁</a>

  <!-- 3. 主要內容區域 -->
  <main class="container">
    
    <!-- 上方並排區塊：左側名片、右側地圖 -->
    <div class="content-top-row">

      <div class="card-box">
        <img src="./P/old.jpg" alt="名片">

      <div class="map-box">

          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2066.5539934863036!2d120.30433195133165!3d22.647055731448443!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346e05002fb0d839%3A0x5d204a8cae54cc0b!2z5LiJ5rCR5YWs6K2J77yI56ef57SE5YWs6K2J77yJ!5e0!3m2!1szh-TW!2stw!4v1788240118796!5m2!1szh-TW!2stw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
           </div>
      </div>
    </div>

    <!-- 下方公證人介紹區塊（現已調整為電腦版兩欄並排，自動伸縮與響應） -->
    <section class="notary-section">

        </div>
        <ul class="notary-info-list">

          <li>德勤商務法律事務所 (勤業眾信聯合會計師事務所聯盟) 實習律師</li>

      <!-- 盧宥霖 公證人 -->
      <div class="notary-card">
        <div class="notary-header">
          <div class="notary-avatar">
             <img src="./P/logo.jpg" alt="盧宥霖 公證人">
          </div>
          <div class="notary-title">
            <h2>盧宥霖 公證人</h2>
          </div>
        </div>
        <ul class="notary-info-list">
          <li>臺灣大學法學碩士</li>
          <li>臺灣大學土木碩士</li>
          <li>臺灣大學土木學士</li>
          <li>宏鑑法律事務所 律師</li>
          <li>益思科技法律事務所 實習律師</li>
        </ul>
      </div>
    </section>

  </main>

  <div id="footer-container"></div>
 
  <script src="main.js" defer></script>

    <script type="application/ld+json">
    {
      "@context" : "https://schema.org",

      "url" : "https://www.tri.tw/"
    }
    </script>
</body>
</html>
