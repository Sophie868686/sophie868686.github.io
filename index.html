<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三民公證</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<style>
      .notary-section {
      max-width: 1100px;
      margin: 40px auto 80px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;  /* 強制垂直上下排列 */
      gap: 30px;
    }

    .notary-card {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 51, 102, 0.08);
      border: 1px solid #e1e8ed;
      padding: 35px 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .notary-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 51, 102, 0.15);
    }

    .notary-header {
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .notary-avatar {
      width: 85px;
      height: 85px;
      background-color: #eaf2f8;
      color: #003366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      flex-shrink: 0;
      overflow: hidden; /* ⚠️ 記得補上這行：讓超出圓形範圍的照片被裁切掉 */
    }

    /* 👇 加入這段全新的 CSS：控制照片不變形 */
    .notary-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 自動裁切並完美填滿，保證照片比例不失真 */
      display: block;
    }

    .notary-title h2 {
      font-size: 24px;
      color: #003366;
      font-weight: 600;
    }

    /* 認證資格標籤 */
    .badge-certified {
      display: inline-block;
      background-color: #e6f0fa;
      color: #0066cc;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 12px;
      margin-top: 5px;
      font-weight: bold;
    }

    /* 資歷列表 */
    .notary-info-list {
      list-style: none;
      padding: 0;
    }

    .notary-info-list li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 12px;
      font-size: 15px;
      color: #444444;
      line-height: 1.6;
    }

    /* 列表勾選圖示 */
    .notary-info-list li::before {
      content: "\f00c"; /* FontAwesome Check icon */
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 0;
      top: 2px;
      color: #0066cc;
      font-size: 14px;
    }
</style>
<body>

  <!-- 1. Header 頁首導覽 -->
  <div id="header-container"></div>

  <!-- 2. Hero Banner 與橫幅標題 -->
  <section class="hero-banner">
    <h1 class="hero-title">公證效力及費用與法院相同</h1>
  </section>

  <!-- 麵包屑導航 (Breadcrumb) -->
  <div class="breadcrumb-container">
    <a href="index.html">首頁</a> 
  </div>

  <!-- 3. 主要內容區域 -->
  <main class="container">
    
    <!-- 左側分類與搜尋 (Sidebar) -->
  <!-- <aside>
    <h2 class="sidebar-title">公證人資訊 <span>Notary Public</span></h2>
    <ul class="category-list"> -->
      <!-- 加入 a 標籤設定 href="about.html" -->
      <!-- <a href="about.html" style="text-decoration: none; color: inherit; display: block;">
        <li class="category-item active">公證人介紹</li>
      </a>
    </ul>
</aside> -->

    <section class="article-grid">
      <a>地圖圖片放置處</a>
    </section>


    <section class="notary-section">

      <!-- 盧宥霖 公證人 -->
      <div class="notary-card">
        <div class="notary-header">
          <div class="notary-avatar">
             <img src="./P/logo.jpg" alt="盧宥霖 公證人">
          </div>
          <div class="notary-title">
            <h2>盧宥霖 公證人</h2>
          </div>
        </div>
        <ul class="notary-info-list">
          <li>臺灣大學法學碩士</li>
          <li>臺灣大學土木碩士</li>
          <li>臺灣大學土木學士</li>
          <li>宏鑑法律事務所 律師</li>
          <li>益思科技法律事務所 實習律師</li>
        </ul>
      </div>

      <!-- 汪家合 公證人 -->
      <div class="notary-card">
        <div class="notary-header">
          <div class="notary-avatar">
            <!-- 把原本的 i 標籤換成 img 標籤，並填入正確的照片路徑 -->
          <img src="./P/wang.jpg" alt="汪家合 公證人">
          </div>
          <div class="notary-title">
            <h2>汪家合 公證人</h2>
            <div class="badge-certified"><i class="fa-solid fa-award"></i> 司法院核定英文第一級，可辦理英文公證、認證</div>
          </div>
        </div>
        <ul class="notary-info-list">
          <li>臺灣大學法學碩士</li>
          <li>英國倫敦大學經濟碩士</li>
          <li>臺灣大學政治、經濟雙學士</li>
          <li>普華商務法律事務所 (資誠聯合會計師事務所聯盟) 律師</li>
          <li>德勤商務法律事務所 (勤業眾信聯合會計師事務所聯盟) 實習律師</li>
        </ul>
      </div>
    </section>

  </main>

  <div id="footer-container"></div>
 
  <script>
      // 載入 Header
      fetch('header.html')
      .then(response => response.text())
      .then(data => {
        // 1. 將抓取到的 HTML 塞入容器中
        document.getElementById('header-container').innerHTML = data;

        // =========================================
        // 2. 處理原本的手機版漢堡選單
        // =========================================
        const menuToggle = document.getElementById('menuToggle');
        const mainNav = document.getElementById('mainNav');
        
        if (menuToggle && mainNav) {
          menuToggle.addEventListener('click', function() {
            mainNav.classList.toggle('active');
          });
        }

        // =========================================
        // 3. 處理「稅務新聞」兩層選單點擊展開邏輯
        // =========================================
        // ⚠️ 此時網頁裡已經有 header 的內容了，可以安心選取
        const submenuBtns = document.querySelectorAll(".dropdown-submenu > a");

        submenuBtns.forEach(btn => {
          btn.addEventListener("click", function (e) {
            e.preventDefault();       // 阻止預設跳轉
            e.stopPropagation();      // 防止事件往上冒泡

            const currentSubmenu = this.parentElement;

            // 手風琴效果：關閉其他已經展開的子選單
            document.querySelectorAll(".dropdown-submenu").forEach(item => {
              if (item !== currentSubmenu) {
                item.classList.remove("active");
              }
            });

            // 切換目前點擊項目的展開 / 收合狀態
            currentSubmenu.classList.toggle("active");
          });
        });

      })
      .catch(error => {
        console.error('載入 header 時發生錯誤:', error);
      });
        
      // 載入 Footer
      fetch('footer.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
          
        // 取得按鈕與 QR Code 圖片的 DOM 元素
        const lineBtn = document.getElementById('line-btn');
        const lineQrCode = document.getElementById('line-qrcode');

        // 當滑鼠移入按鈕時，顯示 QR Code
        lineBtn.addEventListener('mouseenter', function() {
          lineQrCode.style.display = 'block';
        });

        // 當滑鼠移出按鈕時，隱藏 QR Code
        lineBtn.addEventListener('mouseleave', function() {
          lineQrCode.style.display = 'none' ;
        });
        });

    </script>
</body>
</html>
