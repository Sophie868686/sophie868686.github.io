<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>判決要旨 - 三民公證所</title>
  <!-- 引入 FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="story-style.css">
</head>
<style>
    
   .case-title {
     margin-bottom: 10px;  
    }
    h1.case-title {
      color: black !important; 
    }
    /* 讓標題內的連結繼承原本標題的顏色，並移除底線 */
    .case-title a {
    text-decoration: none; /* 移除底線 */
    color: inherit;        /* 繼承 h1 的文字顏色 */
    }

    /* 當滑鼠游標移過去時，可以加一點效果（例如變色或加底線，可依需求設定） */
    .case-title a:hover {
    color: #000000;        /* 換成您喜歡的顏色 */
    /* text-decoration: underline; */ /* 如果需要滑鼠移過去顯示底線可以取消此行註解 */
    }
    h2.section-title {
      color: black !important;
        text-align: left;
    }
    h2.section-title::before {
      display: none !important;
    }
</style>

<body>

  <!-- 1. Header 頁首導覽 -->
  <div id="header-container"></div>

  <!-- 麵包屑導航 (Breadcrumb) -->
  <div class="breadcrumb-container">
    <a href="../index.html">首頁</a> &gt; <span>判決要旨</span>
  </div>
  <main>
    <h1 class="case-title" id="case1">《最高法院判決要旨》租賃物現況雖不符合建築技術規則，但無使用上安全之瑕疵，承租人得否主張解除租約?</h1>
    <h2 class="section-title">租賃物之現況未符合於建築技術成規規定，但無使用上安全之瑕疵，承租人得否主張解除契約並請求返還租金與擔保金?</h2>
    <img src="/P/archives-1.jpg" alt="判決相關圖片說明" class="case-photo">
    <h1 class="case-title" id="case2">《最高法院判例要旨》因不可歸責於雙方事由致租賃物毀損後，房東有無修繕義務？</h1>
    <img src="/P/archives-21.jpg" alt="判決相關圖片說明" class="case-photo">
    <h1 class="case-title" id="case3">《最高法院判決要旨》房東違反修繕義務，房客得否拒付租金？</h1>
    <img src="/P/archives-2.jpg" alt="判決相關圖片說明" class="case-photo">
    
    
  </main>

  <!-- Footer 頁尾 -->
  <div id="footer-container"></div>
 
  <script>
       // 載入 Header
      fetch('../header.html')
      
      .then(response => response.text())
      .then(data => {
        // 1. 將抓取到的 HTML 塞入容器中
        document.getElementById('header-container').innerHTML = data;

        // =========================================
        // 2. 處理原本的手機版漢堡選單
        // =========================================
        const menuToggle = document.getElementById('menuToggle');
        const mainNav = document.getElementById('mainNav');
        
        if (menuToggle && mainNav) {
          menuToggle.addEventListener('click', function() {
            mainNav.classList.toggle('active');
          });
        }

        // =========================================
        // 3. 處理「稅務新聞」兩層選單點擊展開邏輯
        // =========================================
        // ⚠️ 此時網頁裡已經有 header 的內容了，可以安心選取
        const submenuBtns = document.querySelectorAll(".dropdown-submenu > a");

        submenuBtns.forEach(btn => {
          btn.addEventListener("click", function (e) {
            e.preventDefault();       // 阻止預設跳轉
            e.stopPropagation();      // 防止事件往上冒泡

            const currentSubmenu = this.parentElement;

            // 手風琴效果：關閉其他已經展開的子選單
            document.querySelectorAll(".dropdown-submenu").forEach(item => {
              if (item !== currentSubmenu) {
                item.classList.remove("active");
              }
            });

            // 切換目前點擊項目的展開 / 收合狀態
            currentSubmenu.classList.toggle("active");
          });
        });

      })
      .catch(error => {
        console.error('載入 header 時發生錯誤:', error);
      });

      // 載入 Footer
      fetch('../footer.html')
        .then(response => {
          if (!response.ok) throw new Error('Footer 載入失敗');
          return response.text();
        })
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
        })
        .catch(error => console.error('Error loading footer:', error));
  </script>
</body>
</html>
